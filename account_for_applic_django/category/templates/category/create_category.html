{% extends 'base.html' %}

{% block title %}Добавление категории{% endblock %}

{% block content %}
    <div class="category-form">
        <h1>Добавление категории</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Добавить категорию
            </button>
        </form>

        <a href="{% url 'category:list' %}">
            Вернуться к категориям
        </a>
    </div>
{% endblock %}
