<article class="request-card">
    <h2>{{ request.id }}</h2>
    <p>
        Категория:
        <strong>{{ request.category.name }}</strong>
    </p>
    <p>
        Статус:
        <strong>{{ request.status.name }}</strong>
    </p>
    <p>
        Пользователь:
        <strong>{{ request.user.username }}</strong>
    </p>
    <a
        class="page-link"
        href="{% url 'user_requests:detail' request.id %}"
    >
        Подробнее
    </a>
</article>
