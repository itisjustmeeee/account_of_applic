{% if page_obj.paginator.num_pages > 1 %}
    <nav class="pagination" aria-label="Постраничная навигация">
        {% if page_obj.has_previous %}
            <a href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page=1">
                Первая
            </a>
            <a href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.previous_page_number }}">
                Назад
            </a>
        {% endif %}
        <span class="pagination-current">
            Страница {{ page_obj.number }}
            из {{ page_obj.paginator.num_pages }}
        </span>
        {% if page_obj.has_next %}
            <a href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.next_page_number }}">
                Вперед
            </a>
            <a href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.paginator.num_pages }}">
                Последняя
            </a>
        {% endif %}
    </nav>
{% endif %}
